# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Spark Tests

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test_combinations:
    name: Test ${{ matrix.spark }} ${{ matrix.pandas }} Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    env:
      UV_NO_SYNC: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
        spark: ["pyspark==3.5.8", "pyspark==4.0.4", "pyspark==4.1.1"]
        pandas: ["pandas==2.2.0", "pandas==2.3.3"]
        include:
          # numpy<2 (pyspark 3.x [connect], pandas 2.2) breaks pyarrow>=26,
          # which needs numpy>=2 at import without declaring it
          - spark: "pyspark==3.5.8"
            constraints: "pyarrow<26"
          - pandas: "pandas==2.2.0"
            constraints: "pyarrow<26"
          - python-version: "3.11"
            spark: "pyspark"
            pandas: "pandas"

    steps:
    - name: Clone repo
      uses: actions/checkout@v5

    - name: Setup Java 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "17"

    - name: Setup uv ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: false
        cache-dependency-glob: "pyproject.toml"
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      env:
        CONSTRAINTS: ${{ matrix.constraints }}
      run: |
        uv pip install -e . -r pyproject.toml --all-extras --group dev "${{ matrix.spark }}" "${{ matrix.pandas }}" $CONSTRAINTS
        uv pip freeze

    - name: Test
      run: make testspark

  test_connect:
    name: Spark Connect
    runs-on: ubuntu-latest
    env:
      UV_NO_SYNC: "1"

    steps:
    - name: Clone repo
      uses: actions/checkout@v5

    - name: Setup Java 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "17"

    - name: Setup uv 3.11
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: false
        cache-dependency-glob: "pyproject.toml"
        python-version: "3.11"

    - name: Install dependencies
      run: |
        uv pip install -e . -r pyproject.toml --all-extras --group dev "pyspark==3.5.8" "pandas==2.3.3" "pyarrow<26"
        uv pip freeze

    - name: Test
      run: |
        make sparkconnect
        make testsparkconnect
